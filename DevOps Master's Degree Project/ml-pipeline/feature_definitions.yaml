    - name: pods_deleted_count
      type: integer
      description: "Pods deleted"
      source: ["kubernetes"]

    - name: pods_evicted_count
      type: integer
      description: "Pods evicted"
      source: ["kubernetes"]

    - name: pods_failed_count
      type: integer
      description: "Failed pod instances"
      source: ["kubernetes"]

    # Scaling events
    - name: scale_up_events_count
      type: integer
      description: "Scale-up events"
      source: ["kubernetes", "hpa_events"]

    - name: scale_down_events_count
      type: integer
      description: "Scale-down events"
      source: ["kubernetes", "hpa_events"]

    - name: replica_count_avg
      type: float
      description: "Average replica count"
      source: ["kubernetes"]

    # Health checks
    - name: liveness_probe_failures
      type: integer
      description: "Liveness probe failures"
      source: ["kubernetes"]

    - name: readiness_probe_failures
      type: integer
      description: "Readiness probe failures"
      source: ["kubernetes"]

    # Image security
    - name: unsigned_images_count
      type: integer
      description: "Unsigned container images deployed"
      source: ["admission_controller", "policy_logs"]

    - name: images_from_unknown_registries
      type: integer
      description: "Images from non-approved registries"
      source: ["admission_controller"]

    # Network policies
    - name: network_policy_violations
      type: integer
      description: "Network policy violations"
      source: ["kubernetes_network_logs"]

    # Container exits
    - name: container_exit_code_0_count
      type: integer
      description: "Clean container exits"
      source: ["kubernetes"]

    - name: container_exit_nonzero_count
      type: integer
      description: "Abnormal container exits"
      source: ["kubernetes"]

# ==============================================================================
# CATEGORY 7: DEPLOYMENT EVENTS (22 features)
# ==============================================================================
deployments:
  description: "Deployment and release events"
  total_features: 22
  features:
    # Deployment frequency
    - name: deployments_count
      type: integer
      description: "Total deployments"
      source: ["argocd", "kubernetes", "github_actions"]

    - name: deployments_per_day
      type: float
      description: "Deployment frequency"
      derived: true

    # Deployment outcomes
    - name: deployments_successful_count
      type: integer
      description: "Successful deployments"
      source: ["argocd", "github_actions"]

    - name: deployments_failed_count
      type: integer
      description: "Failed deployments"
      source: ["argocd", "github_actions"]

    - name: deployment_success_rate
      type: float
      description: "Deployment success rate"
      derived: true

    # Rollback events
    - name: rollbacks_count
      type: integer
      description: "Deployment rollbacks"
      source: ["argocd", "kubernetes"]

    - name: rollback_rate
      type: float
      description: "Rollback rate"
      derived: true

    # Deployment timing
    - name: deployment_duration_avg_seconds
      type: float
      description: "Average deployment duration"
      source: ["argocd", "kubernetes"]

    - name: deployment_duration_max_seconds
      type: float
      description: "Maximum deployment duration"
      source: ["argocd"]

    - name: time_between_deployments_hours
      type: float
      description: "Time between deployments"
      derived: true

    # Environment targeting
