network:
  description: "Network traffic and connection patterns"
  total_features: 15
  features:
    # Traffic volume
    - name: network_ingress_mb
      type: float
      description: "Inbound network traffic (MB)"
      source: ["prometheus", "network_monitoring"]

    - name: network_egress_mb
      type: float
      description: "Outbound network traffic (MB)"
      source: ["prometheus", "network_monitoring"]

    - name: network_total_mb
      type: float
      description: "Total network traffic"
      derived: true

    # Connection patterns
    - name: connections_established_count
      type: integer
      description: "New connections established"
      source: ["network_monitoring"]

    - name: connections_closed_count
      type: integer
      description: "Connections closed"
      source: ["network_monitoring"]

    - name: connections_active_avg
      type: float
      description: "Average active connections"
      source: ["prometheus"]

    # Protocol distribution
    - name: http_traffic_percent
      type: float
      description: "HTTP traffic percentage"
      source: ["network_monitoring"]

    - name: https_traffic_percent
      type: float
      description: "HTTPS traffic percentage"
      source: ["network_monitoring"]

    - name: dns_queries_count
      type: integer
      description: "DNS query count"
      source: ["network_monitoring"]

    # External connections
    - name: unique_external_ips_count
      type: integer
      description: "Unique external IPs contacted"
      source: ["network_monitoring"]

    - name: external_connections_suspicious
      type: integer
      description: "Connections to suspicious IPs"
      source: ["threat_intel", "network_monitoring"]

    # Bandwidth utilization
    - name: bandwidth_utilization_percent
      type: float
      description: "Network bandwidth utilization"
      derived: true

    # Latency
    - name: network_latency_avg_ms
      type: float
      description: "Average network latency"
      source: ["prometheus"]

    - name: network_latency_p99_ms
      type: float
      description: "99th percentile latency"
      source: ["prometheus"]

    # Anomalies
    - name: network_anomalies_count
      type: integer
      description: "Detected network anomalies"
      derived: true

